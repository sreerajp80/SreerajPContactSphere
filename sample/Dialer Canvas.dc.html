<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>

<div style="position:absolute;left:80px;top:24px;font:800 22px 'Plus Jakarta Sans',system-ui;color:#1e2433;letter-spacing:-.4px">Dialer — on-brand</div>
<div style="position:absolute;left:80px;top:56px;font:500 13px 'Plus Jakarta Sans',system-ui;color:#6b7280">Plus Jakarta Sans, themed tokens, T9 keypad, live contact match, favorites, add-to-contacts. Tap keys to try it.</div>

<div style="position:absolute;left:1010px;top:120px;width:250px;background:#fef4a8;padding:14px 16px;font:500 12.5px/1.5 'Plus Jakarta Sans',system-ui;color:#5c4d12;box-shadow:0 6px 16px -6px rgba(0,0,0,.18);transform:rotate(1.2deg);border-radius:2px">Empty state shows <b>Favorites</b>. Start typing → matching contacts surface with the digits highlighted; no match offers <b>Add to contacts</b>.</div>

<!-- LIGHT -->
<div style="position:absolute;left:80px;top:120px;width:404px">
  <div data-drags-parent="1" style="position:absolute;top:-26px;font:700 12px 'Plus Jakarta Sans',system-ui;color:#475569">Light mode</div>
  <div style="background:#0b0b0f;border-radius:46px;padding:12px;box-shadow:0 40px 70px -28px rgba(15,23,42,.4)">
    <div data-screen-label="Dialer · Light" style="border-radius:34px;overflow:hidden">
      <dc-import name="DialerScreen" theme="light" hint-size="380px,806px"></dc-import>
    </div>
  </div>
</div>

<!-- DARK -->
<div style="position:absolute;left:560px;top:120px;width:404px">
  <div data-drags-parent="1" style="position:absolute;top:-26px;font:700 12px 'Plus Jakarta Sans',system-ui;color:#475569">Dark mode</div>
  <div style="background:#0b0b0f;border-radius:46px;padding:12px;box-shadow:0 40px 70px -28px rgba(15,23,42,.6)">
    <div data-screen-label="Dialer · Dark" style="border-radius:34px;overflow:hidden">
      <dc-import name="DialerScreen" theme="dark" hint-size="380px,806px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
